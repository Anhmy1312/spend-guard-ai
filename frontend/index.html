<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendGuard AI — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            near: '#00EC97',
            dark: '#0a0a0a',
            card: '#1a1a1a',
            lightbg: '#f3f4f6',
            lightcard: '#ffffff',
          }
        }
      }
    }
  </script>
  <style>
    .status-pending {
      @apply bg-yellow-500/20 text-yellow-300 border-yellow-500/30;
    }

    .status-approved {
      @apply bg-green-500/20 text-green-300 border-green-500/30;
    }

    .status-blocked {
      @apply bg-red-500/20 text-red-300 border-red-500/30;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .toast {
      animation: slideIn 0.3s ease-out;
    }

    .light .bg-dark {
      background-color: #f3f4f6;
    }

    .light .bg-card {
      background-color: #ffffff;
    }

    .light .text-white {
      color: #111827;
    }

    .light .text-gray-400 {
      color: #6b7280;
    }

    .light .text-gray-500 {
      color: #9ca3af;
    }

    .light .text-gray-300 {
      color: #374151;
    }

    .light .text-gray-600 {
      color: #9ca3af;
    }

    .light .border-gray-800 {
      border-color: #e5e7eb;
    }

    .light .bg-gray-900 {
      background-color: #f9fafb;
    }

    .light .bg-gray-800 {
      background-color: #e5e7eb;
    }

    .light .border-gray-700 {
      border-color: #d1d5db;
    }
  </style>
</head>

<body class="bg-dark text-white min-h-screen transition-colors duration-300">
  <div class="container mx-auto px-4 py-6 max-w-6xl">

    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between mb-8 pb-6 border-b border-gray-800">
      <div>
        <h1 class="text-3xl font-bold text-near">SpendGuard AI</h1>
        <p class="text-gray-400 text-sm mt-1">AI Agent Spending Control & Safety Layer on NEAR</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center gap-3">
        <button onclick="toggleTheme()" id="theme-toggle"
          class="p-2 rounded-lg bg-gray-800 border border-gray-700 hover:border-near transition"
          title="Toggle dark/light mode">
          <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
        <span class="text-sm text-gray-400">NEAR Testnet</span>
        <span id="wallet-status" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-800 border border-gray-700">
          Connecting...
        </span>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left Column: Settings & Limits -->
      <div class="lg:col-span-1 space-y-6">

        <!-- Spending Limits Card -->
        <div class="bg-card rounded-xl p-5 border border-gray-800">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
              <svg class="w-5 h-5 text-near" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                </path>
              </svg>
              Spending Limits
            </h2>
            <button onclick="resetDailyLimit()" class="text-xs text-gray-400 hover:text-near transition"
              title="Reset daily spent to 0">
              Reset Daily
            </button>
          </div>
          <div id="limits-list" class="space-y-3">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Safety Rules Card -->
        <div class="bg-card rounded-xl p-5 border border-gray-800">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
              </path>
            </svg>
            Safety Rules
          </h2>
          <div id="rules-list" class="space-y-2 text-sm">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- AI Simulator Card -->
        <div class="bg-card rounded-xl p-5 border border-gray-800">
          <h2 class="text-lg font-semibold mb-4">Simulate AI Agent</h2>
          <form id="simulate-form" class="space-y-3">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Agent ID</label>
              <input type="text" id="sim-agent" value="ai-agent-alpha"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-near">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Amount (NEAR)</label>
              <input type="number" id="sim-amount" step="0.1" value="1.0"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-near">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Recipient</label>
              <input type="text" id="sim-recipient" value="alice.testnet"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-near">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Description</label>
              <input type="text" id="sim-desc" value="Payment for compute service"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-near">
            </div>
            <button type="submit" id="sim-submit-btn"
              class="w-full bg-near text-black font-semibold py-2 rounded-lg hover:bg-green-400 transition flex items-center justify-center gap-2">
              <span id="sim-btn-text">Submit AI Proposal</span>
              <svg id="sim-spinner" class="w-4 h-4 spinner hidden" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </button>
          </form>
        </div>

      </div>

      <!-- Right Column: Chart + Proposals -->
      <div class="lg:col-span-2 space-y-6">

        <!-- Spending Chart Card -->
        <div class="bg-card rounded-xl p-5 border border-gray-800">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
              <svg class="w-5 h-5 text-near" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                </path>
              </svg>
              Spending Statistics
            </h2>
            <button onclick="exportLogs()"
              class="text-xs text-gray-400 hover:text-near transition flex items-center gap-1"
              title="Export logs to CSV">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
              </svg>
              Export CSV
            </button>
          </div>
          <div class="relative h-48">
            <canvas id="spending-chart"></canvas>
          </div>
        </div>

        <!-- Proposals List Card -->
        <div class="bg-card rounded-xl p-5 border border-gray-800">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">AI Action Proposals</h2>
            <button onclick="loadProposals()" class="text-sm text-near hover:underline">Refresh</button>
          </div>
          <div id="proposals-list" class="space-y-4">
            <!-- Loaded dynamically -->
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let spendingChart = null;

    // Toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-green-500/20 border-green-500/30 text-green-300' :
        type === 'error' ? 'bg-red-500/20 border-red-500/30 text-red-300' :
          'bg-blue-500/20 border-blue-500/30 text-blue-300';
      toast.className = `toast px-4 py-3 rounded-lg border ${bgColor} text-sm max-w-sm shadow-lg`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Show/hide spinner
    function setButtonLoading(btnId, textId, spinnerId, loading) {
      const btn = document.getElementById(btnId);
      const text = document.getElementById(textId);
      const spinner = document.getElementById(spinnerId);
      if (loading) {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        text.textContent = 'Processing...';
        spinner.classList.remove('hidden');
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        text.textContent = 'Submit AI Proposal';
        spinner.classList.add('hidden');
      }
    }

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
        document.getElementById('theme-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('theme-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
      }
      updateChartTheme();
    }

    // Apply saved theme on load
    (function () {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    })();

    // Load NEAR wallet status
    async function loadNearStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/near/status`);
        const data = await res.json();
        const el = document.getElementById('wallet-status');
        if (data.connected) {
          el.textContent = `Connected · Block #${data.latestBlockHeight}`;
          el.className = 'px-3 py-1 rounded-full text-xs font-medium bg-green-500/20 text-green-300 border border-green-500/30';
        } else {
          el.textContent = 'Disconnected';
          el.className = 'px-3 py-1 rounded-full text-xs font-medium bg-red-500/20 text-red-300 border border-red-500/30';
        }
      } catch (err) {
        document.getElementById('wallet-status').textContent = 'Offline';
      }
    }

    // Load spending limits
    async function loadLimits() {
      try {
        const res = await fetch(`${API_BASE}/api/limits`);
        const data = await res.json();
        const container = document.getElementById('limits-list');
        container.innerHTML = data.limits.map(limit => `
          <div class="bg-gray-900 rounded-lg p-3 border border-gray-800">
            <div class="flex justify-between items-center mb-1">
              <span class="text-sm font-medium">${limit.type === 'DAILY' ? 'Daily Limit' : 'Per-TX Limit'}</span>
              <span class="text-near font-bold">${limit.max_amount} NEAR</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
              <div class="bg-near h-2 rounded-full transition-all duration-500" style="width: ${Math.min((limit.current_spent / limit.max_amount) * 100, 100)}%"></div>
            </div>
            <p class="text-xs text-gray-500 mt-1">Spent: ${limit.current_spent} / ${limit.max_amount} NEAR</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load limits:', err);
      }
    }

    // Load safety rules
    async function loadRules() {
      try {
        const res = await fetch(`${API_BASE}/api/rules`);
        const data = await res.json();
        const container = document.getElementById('rules-list');
        container.innerHTML = data.rules.map(rule => `
          <div class="flex items-center gap-2 p-2 bg-gray-900 rounded-lg border border-gray-800">
            <span class="px-2 py-0.5 rounded text-xs font-medium ${rule.action === 'BLOCK' ? 'bg-red-500/20 text-red-300' : 'bg-green-500/20 text-green-300'}">${rule.action}</span>
            <span class="text-gray-300">${rule.name}</span>
            <span class="text-gray-500 text-xs ml-auto">${rule.pattern}</span>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load rules:', err);
      }
    }

    // Load proposals
    async function loadProposals() {
      try {
        const res = await fetch(`${API_BASE}/api/proposals`);
        const data = await res.json();
        const container = document.getElementById('proposals-list');
        if (!data.proposals || data.proposals.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-center py-8">No proposals yet. Simulate an AI agent action!</p>';
          return;
        }
        container.innerHTML = data.proposals.map(p => {
          const statusClass = p.status === 'PENDING' ? 'status-pending' : p.status === 'APPROVED' ? 'status-approved' : 'status-blocked';
          return `
            <div class="bg-gray-900 rounded-lg p-4 border border-gray-800">
              <div class="flex items-start justify-between mb-2">
                <div class="flex-1 min-w-0">
                  <p class="font-medium text-white truncate">${p.description || 'No description'}</p>
                  <p class="text-xs text-gray-500 mt-1">Agent: ${p.agent_id} · ${p.recipient}</p>
                  ${p.tx_hash ? `<p class="text-xs text-gray-600 mt-1 font-mono truncate">Tx: ${p.tx_hash}</p>` : ''}
                </div>
                <span class="px-2.5 py-1 rounded-full text-xs font-medium border ${statusClass} ml-3 flex-shrink-0">${p.status}</span>
              </div>
              <div class="flex items-center justify-between mt-3 gap-2">
                <span class="text-near font-bold text-lg">${p.amount} NEAR</span>
                <div class="flex items-center gap-2">
                  ${p.status === 'PENDING' ? `
                    <button onclick="approveProposal(${p.id})" class="bg-near text-black text-sm font-semibold px-4 py-1.5 rounded-lg hover:bg-green-400 transition">
                      Approve & Send
                    </button>
                    <button onclick="rejectProposal(${p.id})" class="bg-red-500/20 text-red-300 text-sm font-semibold px-4 py-1.5 rounded-lg hover:bg-red-500/30 transition border border-red-500/30">
                      Reject
                    </button>
                  ` : ''}
                  ${p.status === 'APPROVED' && p.tx_hash ? `
                    <a href="#" onclick="viewTx('${p.tx_hash}'); return false;" class="text-near text-sm hover:underline flex items-center gap-1">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                      View on Explorer
                    </a>
                  ` : ''}
                </div>
              </div>
              <p class="text-xs text-gray-600 mt-2">${new Date(p.created_at).toLocaleString()}</p>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load proposals:', err);
      }
    }

    // Approve a proposal
    async function approveProposal(id) {
      try {
        const res = await fetch(`${API_BASE}/api/proposals/${id}/approve`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          showToast(`✅ Transaction sent! Hash: ${data.transactionHash.substring(0, 12)}...`, 'success');
        } else {
          showToast(`❌ Failed: ${data.error || data.message}`, 'error');
        }
        loadProposals();
        loadLimits();
        loadStats();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    // Reject a proposal
    async function rejectProposal(id) {
      try {
        const res = await fetch(`${API_BASE}/api/proposals/${id}/reject`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          showToast('Proposal rejected successfully.', 'success');
        } else {
          showToast(`❌ Failed: ${data.error || data.message}`, 'error');
        }
        loadProposals();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    // Reset daily limit
    async function resetDailyLimit() {
      try {
        const res = await fetch(`${API_BASE}/api/limits/reset`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          showToast('Daily spending limit reset to 0.', 'success');
        } else {
          showToast(`❌ Failed: ${data.error || data.message}`, 'error');
        }
        loadLimits();
        loadStats();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    // View transaction on NEAR Explorer
    function viewTx(txHash) {
      window.open(`https://explorer.testnet.near.org/transactions/${txHash}`, '_blank');
    }

    // Export logs to CSV
    function exportLogs() {
      window.open(`${API_BASE}/api/logs/export`, '_blank');
      showToast('Downloading CSV...', 'info');
    }

    // Load spending stats and render chart
    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`);
        const data = await res.json();
        const labels = data.stats.map(s => s.date);
        const values = data.stats.map(s => s.total_spent);
        const isDark = document.documentElement.classList.contains('dark');
        const textColor = isDark ? '#9ca3af' : '#374151';
        const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';

        if (spendingChart) {
          spendingChart.data.labels = labels;
          spendingChart.data.datasets[0].data = values;
          spendingChart.options.scales.x.ticks.color = textColor;
          spendingChart.options.scales.y.ticks.color = textColor;
          spendingChart.options.scales.x.grid.color = gridColor;
          spendingChart.options.scales.y.grid.color = gridColor;
          spendingChart.update();
        } else {
          const ctx = document.getElementById('spending-chart').getContext('2d');
          spendingChart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'NEAR Spent',
                data: values,
                backgroundColor: 'rgba(0, 236, 151, 0.6)',
                borderColor: 'rgba(0, 236, 151, 1)',
                borderWidth: 1,
                borderRadius: 6,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `${ctx.parsed.y} NEAR`
                  }
                }
              },
              scales: {
                x: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } },
                y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor }, beginAtZero: true }
              }
            }
          });
        }
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    // Update chart theme colors
    function updateChartTheme() {
      if (!spendingChart) return;
      const isDark = document.documentElement.classList.contains('dark');
      const textColor = isDark ? '#9ca3af' : '#374151';
      const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
      spendingChart.options.scales.x.ticks.color = textColor;
      spendingChart.options.scales.y.ticks.color = textColor;
      spendingChart.options.scales.x.grid.color = gridColor;
      spendingChart.options.scales.y.grid.color = gridColor;
      spendingChart.update();
    }

    // Handle simulate form
    document.getElementById('simulate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      setButtonLoading('sim-submit-btn', 'sim-btn-text', 'sim-spinner', true);
      const body = {
        agent_id: document.getElementById('sim-agent').value,
        amount: parseFloat(document.getElementById('sim-amount').value),
        recipient: document.getElementById('sim-recipient').value,
        description: document.getElementById('sim-desc').value,
      };
      try {
        const res = await fetch(`${API_BASE}/api/proposals/simulate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          const emoji = data.evaluation.result === 'PENDING' ? '✅' : '🚫';
          showToast(`${emoji} ${data.evaluation.result}: ${data.evaluation.reason}`, data.evaluation.result === 'PENDING' ? 'success' : 'error');
        } else {
          showToast(`❌ Error: ${data.error}`, 'error');
        }
        loadProposals();
        loadLimits();
        loadStats();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      } finally {
        setButtonLoading('sim-submit-btn', 'sim-btn-text', 'sim-spinner', false);
      }
    });

    // Initialize
    loadNearStatus();
    loadLimits();
    loadRules();
    loadProposals();
    loadStats();

    // Auto-refresh every 10 seconds
    setInterval(() => {
      loadProposals();
      loadLimits();
      loadNearStatus();
      loadStats();
    }, 10000);
  </script>
</body>

</html>
